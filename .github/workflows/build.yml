# Builds PoBLevelingCompanion.exe on GitHub's Windows runners.
# - every push to main / pull request: build and keep the exe as a workflow artifact (14 days)
# - a pushed tag like v0.1.1: also attach the exe + its SHA-256 to the GitHub release of that tag
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies (pinned)
        run: python -m pip install -r requirements-build.txt

      - name: Check the sources compile
        run: python -m py_compile server.py app.py tools/update_gem_data.py tools/update_gem_names_ja.py tools/make_version_info.py updater.py

      - name: Version info (from VERSION)
        run: python tools/make_version_info.py

      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name PoBLevelingCompanion --specpath build
          --version-file "${{ github.workspace }}\build\version_info.txt"
          --add-data "${{ github.workspace }}\static;static"
          --add-data "${{ github.workspace }}\data;data"
          --add-data "${{ github.workspace }}\VERSION;."
          app.py

      - name: SHA-256 checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\PoBLevelingCompanion.exe -Algorithm SHA256).Hash.ToLower()
          "$h  PoBLevelingCompanion.exe" | Set-Content -Encoding ascii dist\PoBLevelingCompanion.exe.sha256
          Get-Content dist\PoBLevelingCompanion.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: PoBLevelingCompanion
          path: |
            dist/PoBLevelingCompanion.exe
            dist/PoBLevelingCompanion.exe.sha256
          retention-days: 14
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        # release notes template: .github/release-notes.md

      - name: Tag must match VERSION
        run: |
          v="v$(tr -d '[:space:]' < VERSION)"
          if [ "$v" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match VERSION ($v). Update VERSION before tagging."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: PoBLevelingCompanion
          path: dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # release page text, incl. the "Code signing policy" link SignPath asks for on download pages
          sed -e "s#{{REPO}}#${GITHUB_REPOSITORY}#g" -e "s#{{TAG}}#${TAG}#g" .github/release-notes.md > notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$TAG" --notes-file notes.md
          fi
